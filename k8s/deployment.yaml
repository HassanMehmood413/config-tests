apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api
  namespace: task-api
spec:
  selector:
    matchLabels:
      app: task-api
  template:
    metadata:
      labels:
        app: task-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: task-api
        image: ghcr.io/hassanmehmood413/task-api:1167f36
        envFrom: 
          - secretRef:
              name: task-api-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "500m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5

--- 
apiVersion: v1
kind: Service
metadata:
  name: task-api-service
  namespace: task-api
  labels:
    app: task-api-service
spec:
  selector:
    app: task-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000

---

apiVersion: v1
kind: Secret
metadata:
  name: task-api-secrets
  namespace: task-api
type: Opaque
